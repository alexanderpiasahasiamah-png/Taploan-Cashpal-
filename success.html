<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful - CASPAL & TapLoan</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;
    background:#f2f6fb;
    text-align:center;
    padding:40px 20px;
}
.success-box{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
}
.check{
    font-size:60px;
    color:#1f6fd6;
}
h2{margin-top:15px;}
.info{margin-top:10px;font-size:14px;color:#555;}
.home-btn{
    margin-top:25px;
    padding:12px 25px;
    background:#1f6fd6;
    border:none;
    color:white;
    border-radius:8px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="success-box">
    <div class="check">✔</div>
    <h2>Payment Successful</h2>
    <div class="info" id="details"></div>
    <button class="home-btn" onclick="window.location.href='dashboard.html'">
        Go to Dashboard
    </button>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const ref = params.get("ref");
const amount = params.get("amount");
const name = params.get("name");

document.getElementById("details").innerHTML =
"Thank you <strong>" + name + "</strong><br><br>" +
"Amount Paid: <strong>GHS " + amount + "</strong><br>" +
"Reference: <strong>" + ref + "</strong><br><br>" +
"Your repayment has been recorded successfully.";
</script>

</body>
</html>
