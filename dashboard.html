<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASPAL & TapLoan Dashboard</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;
    background:#f4f6fb;
    padding:20px;
}
h2{margin-bottom:20px;}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}
input{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
}
button{
    padding:10px 20px;
    background:#1f6fd6;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<h2>CASPAL & TapLoan - Admin Dashboard</h2>

<div class="card">
    <h3>Create Payment Link</h3>

    <input type="text" id="name" placeholder="Customer Name">
    <input type="email" id="email" placeholder="Customer Email">
    <input type="number" id="amount" placeholder="Amount (GHS)">
    <input type="text" id="due" placeholder="Due Date (e.g 20/02/2026)">
    <input type="number" id="overdue" placeholder="Overdue Days">

    <button onclick="generate()">Generate Link</button>

    <p id="result" style="margin-top:15px;word-break:break-all;"></p>
</div>

<script>
function generate(){
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const amount = document.getElementById("amount").value;
    const due = document.getElementById("due").value;
    const overdue = document.getElementById("overdue").value;

    const link = window.location.origin +
    "/repay.html?name=" + name +
    "&email=" + email +
    "&amount=" + amount +
    "&due=" + due +
    "&overdue=" + overdue;

    document.getElementById("result").innerText = link;
}
</script>

</body>
</html>
